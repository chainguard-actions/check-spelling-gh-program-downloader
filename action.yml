name: 'gh program downloader'
description: 'Download a release'
inputs:
  repository:
    description: Repository containing release
    required: false
    default: ${{ github.repository }}
  destination:
    description: Destination
    required: false
    default: ${{ github.workspace }}
  add-to-path:
    description: Add to path
    required: false
    default: ''
  version:
    description: Version to retrieve (defaults to latest)
    required: false
    default: ''
  os:
    description: OS to favor (defaults to current)
    required: false
    default: ''
  os-pattern:
    description: OS pattern to filter (defaults to calculating based on os)
    required: false
    default: ''
  arch:
    description: Architecture to favor (defaults to current)
    required: false
    default: ''
  arch-pattern:
    description: Architecture pattern to filter (defaults to calculating based on arch)
    required: false
    default: ''
  file-re:
    description: File pattern (in case os/arch aren't enough to select)
    required: false
    default: ''
  token:
    description: GitHub Token
    required: false
    default: ${{ github.token }}
  trace:
    description: Trace action
    required: false
    default: ''
outputs:
  url:
    description: Downloaded artifact URL
    value: ${{ steps.action.outputs.url }}
  path:
    description: Path to file on disk
    value: ${{ steps.action.outputs.path }}
runs:
  using: "composite"
  steps:
    - name: Chainguard usage telemetry
      shell: bash
      run: |
        # Best-effort, fails open. Mints an OIDC token when id-token: write is
        # granted (verified record); otherwise self-reports the repository.
        tok=""
        if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ] && [ -n "$ACTIONS_ID_TOKEN_REQUEST_TOKEN" ]; then
          tok=$(curl -sf --max-time 2 \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=actions.chainguard.dev" \
            | sed -n 's/.*"value":"\([^"]*\)".*/\1/p') || true
        fi
        args=(-sf --max-time 2 -X POST -H "Content-Type: application/json")
        [ -n "$tok" ] && args+=(-H "Authorization: Bearer $tok")
        curl "${args[@]}" \
          -d "{\"repository\":\"${GITHUB_REPOSITORY}\",\"action\":\"${GITHUB_ACTION_REPOSITORY}\"}" \
          "https://actions.enforce.dev/actions/v1/record" >/dev/null 2>&1 || true
    - name: Run downloader
      id: action
      continue-on-error: false
      shell: bash
      run: |
        : Run downloader
        $GITHUB_ACTION_PATH/gh-program-downloader
      env:
        GH_TOKEN: ${{ inputs.token }}
        token_is_not_gh_token: ${{ inputs.token != github.token && '1' || '' }}
        repo: ${{ inputs.repository }}
        destination: ${{ inputs.destination }}
        add_to_path: ${{ inputs.add-to-path }}
        version: ${{ inputs.version }}
        os: ${{ inputs.os }}
        os_re: ${{ inputs.os-pattern }}
        arch: ${{ inputs.arch }}
        arch_re: ${{ inputs.arch-pattern }}
        file_re: ${{ inputs.file-re }}
        trace: ${{ inputs.trace || (github.run_attempt > 1 && '1' || '') }}
