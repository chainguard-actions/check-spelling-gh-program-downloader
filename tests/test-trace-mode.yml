name: Test trace mode enabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          repository: check-spelling/check-spelling
          version: v0.0.22
          destination: ${{ github.workspace }}/downloads/check-spelling-trace
          os: linux
          arch: amd64
          trace: '1'
        continue-on-error: true
      - name: Assert action ran with trace enabled
        env:
          OUTCOME: ${{ steps.action.outcome }}
          URL: ${{ steps.action.outputs.url }}
        run: |
          echo "outcome: $OUTCOME"
          echo "url: $URL"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$URL" ]; then
              echo "FAIL: action succeeded but url output is empty"
              exit 1
            fi
            echo "PASS: trace mode did not break the action, url=$URL"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (network/API issue in test environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
