name: Test custom os-pattern and arch-pattern inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          repository: check-spelling/check-spelling
          version: v0.0.22
          destination: ${{ github.workspace }}/downloads/check-spelling-custom
          os-pattern: '[Ll]inux'
          arch-pattern: '[Aa]md64|[Xx]86[-_]64'
        continue-on-error: true
      - name: Assert action ran with custom patterns
        env:
          OUTCOME: ${{ steps.action.outcome }}
          URL: ${{ steps.action.outputs.url }}
          PATH_OUT: ${{ steps.action.outputs.path }}
        run: |
          echo "outcome: $OUTCOME"
          echo "url: $URL"
          echo "path: $PATH_OUT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$URL" ]; then
              echo "FAIL: action succeeded but url output is empty"
              exit 1
            fi
            if [ -z "$PATH_OUT" ]; then
              echo "FAIL: action succeeded but path output is empty"
              exit 1
            fi
            echo "PASS: url=$URL path=$PATH_OUT"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (network/API issue in test environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
