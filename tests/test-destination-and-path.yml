name: Test destination and add-to-path inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          repository: check-spelling/check-spelling
          version: v0.0.22
          destination: ${{ github.workspace }}/bin/check-spelling
          add-to-path: '1'
          os: linux
          arch: amd64
        continue-on-error: true
      - name: Assert destination path output is set
        env:
          OUTCOME: ${{ steps.action.outcome }}
          PATH_OUT: ${{ steps.action.outputs.path }}
        run: |
          echo "outcome: $OUTCOME"
          echo "path output: $PATH_OUT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$PATH_OUT" ]; then
              echo "FAIL: action succeeded but path output is empty"
              exit 1
            fi
            echo "PASS: path output is set to '$PATH_OUT'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (network/API issue in test environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
